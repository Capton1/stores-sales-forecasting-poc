[tool.poetry]
name = "stores-sales-forecasting-poc"
version = "0.1"
description = ""
authors = ["acaille_lbc <acaille@littlebigcode.fr>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12, <3.14"
pandas = "^2.3"
numpy = "^2.2"
scipy = "^1.15"
seaborn = "^0.13.2"
scikit-learn = "~1.5.2"  # XGBoost 2.1 predates the estimator tags of scikit-learn 1.6
hydra-core = "^1.3.8"
shap = ">=0.48"
tensorflow = "^2.21"
keras = "^3.15.1"
tqdm = "^4.67"
# XGBoost 3 grows different trees from the same data; 2.1 reproduces the published results
xgboost = "~2.1.4"
prophet = "^1.1.7"
plotly = "^6.0"
mlflow = "^3.17.2"
hyperopt = "^0.3.0"


[tool.poetry.group.dev.dependencies]
ipykernel = "^7.0"
jupyter = "^1.1"
kaggle = "^1.7"
pytest = "^9.0.3"
pip-audit = "^2.9"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
